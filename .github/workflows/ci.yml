# Pixel Deity — CI
#
# The repo had no CI at all: every pull request reported zero check runs, so
# "the suites pass" was only ever a claim made in the description. This runs
# all five of them on the actual diff.
#
# Deliberately ONE job, so there is exactly one required status check to
# configure in branch protection rather than five.
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a new push supersedes an in-flight run for the same ref
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The layout suite drives a real headless browser. The runner image
      # ships Chrome/Chromium, but not always at the same path, so probe
      # rather than hardcode — and fail loudly instead of silently skipping.
      - name: Locate a browser
        id: browser
        run: |
          for p in \
            /usr/bin/google-chrome \
            /usr/bin/google-chrome-stable \
            /usr/bin/chromium-browser \
            /usr/bin/chromium \
            /opt/google/chrome/chrome
          do
            if [ -x "$p" ]; then
              echo "CHROME_PATH=$p" >> "$GITHUB_ENV"
              echo "found: $p"
              exit 0
            fi
          done
          echo "::error::no Chrome/Chromium found on the runner"
          exit 1

      - name: Syntax-check every module
        run: |
          fail=0
          for f in js/*.js tools/*.js; do
            node --check "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done
          exit $fail

      # every power applied against a real world, no exceptions
      - name: core
        run: node tools/test-core.js .

      # 34 assertions: traits and trades actually drive the simulation
      - name: lives
        run: node tools/test-lives.js .

      # the profiler must actually measure, and Stage 0's two renderer defects
      # must stay fixed. A profiler that silently records nothing is worse
      # than none at all, because it makes a claim.
      - name: perf
        run: node tools/test-perf.js .

      # the clock. The headline assertion runs the same seed for the same span
      # of CALENDAR time at three very different step sizes and demands the
      # worlds agree — nothing else in the suite would notice if a single rate
      # conversion were wrong, because each run stays self-consistent.
      - name: clock
        run: node tools/test-clock.js .

      # the quadtree, exercised directly — coverage, hysteresis, horizon
      # culling and bounding-sphere containment are all invisible in a moving
      # picture and trivial to assert here. js/lod.js makes no GL calls
      # precisely so this can run under Node.
      - name: lod
        run: node tools/test-lod.js .

      # settlements as buildings, and the rule that NOTHING FLOATS. Six fixed
      # lifts used to put every person, label, ring and bolt 77 km above the
      # summit of Everest, and no test in this project would have noticed.
      - name: buildings
        run: node tools/test-buildings.js .

      # the planet is Earth: real places at the right altitude, orientation
      # traps, real cities on real land. This one guards a BAKED ASSET, so it
      # is the only thing standing between a bad rebuild of js/earthdata.js
      # and a planet with no Antarctica.
      - name: earth
        run: node tools/test-earth.js .

      # 27 assertions against a recording WebAudio stub
      - name: audio
        run: node tools/test-audio.js .

      # every element fits, across 6 viewports incl. landscape phone
      - name: layout
        run: node tools/test-layout.js . "$CHROME_PATH"

      # what the GPU is actually asked to draw, in a real WebGL context at
      # three altitudes. drawInner returns early when headless, so this is the
      # only place a draw call can be counted at all.
      - name: render
        run: node tools/test-render.js . "$CHROME_PATH"

      # the slow one (~2 min): boot, loop, powers, save/load, rewind,
      # un-creation, genesis, story
      - name: integration
        run: node tools/test-integration.js .

      # the shipped single-file build must still build
      - name: dist builds
        run: |
          node tools/build-dist.js
          test -s dist/PixelDeity.html || { echo "::error::dist is empty"; exit 1; }
